name: Marcar Asistencia Talana

on:
  repository_dispatch:
    types: [mark-entrada, mark-salida]
  workflow_dispatch:
    inputs:
      tipo:
        description: 'entrada o salida'
        required: true
        default: 'entrada'

jobs:
  mark-attendance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Instalar dependencias
        run: npm install puppeteer
      
      - name: Marcar asistencia con reintentos
        id: mark
        continue-on-error: true
        run: |
          for attempt in 1 2 3; do
            echo "Intento $attempt de 3..."
            if node mark-attendance.js; then
              echo "success=true" >> $GITHUB_OUTPUT
              exit 0
            fi
            if [ $attempt -lt 3 ]; then
              echo "Fallo. Reintentando en 10 segundos..."
              sleep 10
            fi
          done
          echo "success=false" >> $GITHUB_OUTPUT
          exit 1
        env:
          TALANA_USER: ${{ secrets.TALANA_USER }}
          TALANA_PASS: ${{ secrets.TALANA_PASS }}
          TIPO: ${{ github.event.action == 'mark-entrada' && 'entrada' || github.event.action == 'mark-salida' && 'salida' || github.event.inputs.tipo }}
      
      - name: Subir screenshots de diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: |
            step-*.png
            error-screenshot.png
          if-no-files-found: ignore

      - name: Notificar fallo
        if: steps.mark.outputs.success == 'false'
        run: |
          echo "::error::Fallo al marcar asistencia después de 3 intentos"
          exit 1
